# Configuracion del protocolo comun. Los tres bloques del TFM parten de aqui.
# Cualquier cambio en este fichero es un evento de coordinacion: se anuncia en la
# reunion del lunes y los tres recalculan los resultados afectados.
#
# Como se lee: tfmfdd.config.load_baseline() (ruta explicita, variable de entorno
# TFMFDD_CONFIG, este fichero en el directorio de trabajo y, por ultimo, la copia
# que viaja con el paquete en tfmfdd/configs/baseline.yaml). Las dos copias son
# identicas y una prueba lo exige: si cambias una, cambia la otra.
#
# Las claves con valor null son decisiones PENDIENTES de Pablo: se fijan por
# escrito y con fecha en docs/decisiones.md antes de los experimentos
# confirmatorios (memoria, parrafo 369). Ningun script las sustituye por un valor
# por defecto: el que las necesita se niega a ejecutar mientras sigan en null.
#
# La configuracion y la tolerancia de la verificacion frente a Yin et al. (2012)
# no estan aqui: son las de esos autores, no las del protocolo
# (configs/yin2012.yaml).

protocolo:
  alpha: 0.99              # nivel de confianza de los limites de control
  alpha_sensibilidad: 0.95 # segundo nivel, para el analisis de sensibilidad
  k_alarmas: 3             # alarmas consecutivas para confirmar deteccion
  sample_minutes: 3.0      # minutos entre muestras en el TEP
  semilla: 42
  min_fdr: 0.10            # (v0.3) FDR por debajo de la cual una racha de k alarmas
                           # se marca como al azar (detected_at_chance) y su retardo no
                           # se interpreta. Convencion de decisiones.md (22/09); hasta
                           # ahora solo estaba como valor por defecto en el codigo. Cambia el
                           # retardo de compromiso.deteccion: se confirma o cambia antes de la
                           # primera ejecucion confirmatoria de deteccion (2026-11-03)
  retardo_convencion: appearance  # (v0.3) retardo = primera alarma de la primera
                           # racha de k: "la primera de una serie de tres alarmas
                           # seguidas" (memoria, parrafo 276), y retardo nulo si salta
                           # en la muestra 161 (parrafo 289). La otra opcion de
                           # metrics.detection_delay es "confirmation". Como min_fdr, se
                           # confirma o cambia antes de la primera ejecucion confirmatoria de
                           # deteccion (compromiso.deteccion, 2026-11-03)

contrastes:                # (v0.3)
  alpha_contrastes: 0.05   # alfa de los contrastes (Wilcoxon pareado con Holm). NO es
                           # el nivel de confianza de los limites (protocolo.alpha): la
                           # memoria los nombra distinto y fija este valor ("alfa = 0,05
                           # [...] fijada antes de ejecutar", parrafo 358; decisiones.md,
                           # 22/09). Se pasa como alpha= a las funciones de tfmfdd.stats
  delta:                   # Diferencia minima relevante por metrica, en las unidades de
                           # la metrica (fraccion para FDR y FAR, no puntos), sobre la
                           # pseudomediana de Hodges-Lehmann de la diferencia por unidad
                           # de analisis (parrafo 368). En Rieth la unidad es la replica,
                           # en la familia de la hipotesis y en el factor 1, y la
                           # diferencia es la media de sus simulaciones de prueba
                           # (hipotesis.unidad_replica, 2026-11-03; ablaciones.unidad_replica,
                           # 2026-10-28). fdr y far: filas del 2026-10-15 de
                           # docs/decisiones.md (hoja de decision del 15/10)
    fdr: 0.02              # 2 puntos, sobre el exceso de la FDR (hipotesis.metrica_ventaja)
    far: 0.005             # 0,5 puntos; exige una reserva de calibracion grande
                           # (particion.rieth.normales_calibracion; informe 06, A2 y A3)
    retardo_muestras: null # A UNA ADENDA (2026-10-15): el retardo se reporta descriptivo y
                           # con censura; si se contrasta, delta en minutos, con el equipo.
                           # Lo usa compromiso.deteccion (2026-11-03), en muestras: el delta
                           # en minutos entre protocolo.sample_minutes (3). Se fija antes de
                           # la primera ejecucion confirmatoria de deteccion, con anclas
                           # externas y declarando los retardos de desarrollo que ya se
                           # vieron, en una adenda con fecha y etiqueta
    macro_f1: null         # A UNA ADENDA (2026-10-15): con la estimanda del OE2, antes de
                           # sus confirmatorios. Lo usa compromiso.diagnostico (2026-11-03)
  lateralidad: dos_unilaterales  # (2026-10-15) dos unilaterales al alfa_contrastes cada
                           # uno, intervalo de Hodges-Lehmann al 1 - 2 alfa (lo implementado
                           # en stats.non_superiority_test); la refutacion lleva Holm y el
                           # apoyo exige las seis (hypothesis_verdict). La otra opcion era
                           # bilateral (cada cola al 2,5 %, intervalo al 95 %)
  no_contrastables: cuentan_con_p_1  # (2026-10-18) comparaciones no contrastables (menos
                           # de 5 unidades validas, simulaciones o replicas segun el
                           # diseno, stats.MIN_PAIRS, o sin datos):
                           # cuentan en Holm con p = 1, asi que m es el de la familia
                           # declarada, y nunca apoyan (lo implementado en
                           # hypothesis_verdict, compare_arms y compare_methods con la
                           # familia declarada). Rige tambien para las ablaciones y el
                           # OE2. La otra opcion era sacarlas de la familia

hipotesis:                 # familia confirmatoria (parrafos 348, 349 y 368); las claves
                           # en null siguen PENDIENTES
  metrica_ventaja: exceso_far_gemela  # (2026-10-15) FDR de la simulacion con fallo
                           # (muestras 161 a 960) menos la FAR de su gemela normal de
                           # test_fault00 (mismo simulationRun, ventana de
                           # deteccion.ventana_far_normal). Las otras opciones (fdr,
                           # fdr_a_far_igualada) quedan como descriptivas
                           # (imp_contrastes, decisiones 1 y 2)
  mayor_es_mejor: true     # (2026-10-15) sentido de la ventaja (higher_is_better)
  unidad_replica:          # (2026-11-03) en Rieth, el diseno anidado del factor 1
                           # (ablaciones.unidad_replica): la replica r de
                           # particion.rieth.reparto ajusta PCA, DPCA y el autoencoder y
                           # evalua solo su grupo r de simulaciones de prueba (los n mod R
                           # que sobran no entran). En cada comparacion, paired_advantage
                           # dentro del grupo, la media por replica y non_superiority_test
                           # sobre las R medias; igual el suelo (detects_above_far sobre
                           # las medias de fdr y de far), los controles, el analisis
                           # secundario y published_advantage_test. Se reporta la
                           # dispersion entre replicas (fila del 2026-11-03). El valor de
                           # grupos_prueba es la ruta de la clave que da los grupos
    diseno: anidado
    unidad: replicate
    grupos_prueba: ablaciones.unidad_replica.grupos_prueba  # los mismos grupos
    agregado: media        # la ventaja de la replica: la media de las de sus simulaciones
  baselines:               # (2026-10-18) que son "PCA" y "DPCA" en la familia (DIS-10):
                           # el SPE, el error de reconstruccion de un autoencoder lineal,
                           # frente al del autoencoder; el DPCA con 2 retardos (V1, S6).
                           # Los limites, en limites_protocolo; los componentes, con
                           # pca.variance. Formato de experiments/P1_piloto_varianza.py
    - {nombre: pca, estadistico: spe, lags: 0}
    - {nombre: dpca, estadistico: spe, lags: 2}
  baselines_secundarios:   # (2026-10-18) analisis secundario declarado: las mismas seis
                           # comparaciones (autoencoder frente a PCA y DPCA en 3, 9 y 15)
                           # con estos estadisticos, los mismos contrastes (fila 27), el
                           # mismo n y la misma unidad (hipotesis.unidad_replica), en una
                           # tabla aparte del capitulo 4 y FUERA del veredicto. Con las
                           # mismas ejecuciones sale la descomposicion
                           # (AE - T2) = (AE - SPE) + (SPE - T2)
    baselines:
      - {nombre: pca_t2, estadistico: t2, lags: 0}
      - {nombre: dpca_t2, estadistico: t2, lags: 2}
      - {nombre: pca_t2_o_spe, estadistico: t2_o_spe, lags: 0}
      - {nombre: dpca_t2_o_spe, estadistico: t2_o_spe, lags: 2}
    holm: por_estadistico  # (2026-10-25) p ajustados por Holm dentro de cada bloque de
                           # seis comparaciones, uno por estadistico (T2 y regla T2 o SPE),
                           # como la familia principal; solo para leerlos, no deciden nada.
                           # La otra opcion era un bloque de doce
  fallos_control:          # (2026-10-18) fallos en los que se espera deteccion (parrafo
                           # 368). Regla: FDR de PCA y de DPCA entre el 20 % y el 80 % en la
                           # Tabla 4 de Yin et al. (2012), sin el 21 (no esta en Rieth); los
                           # unicos por debajo del 20 % son el 3, el 9 y el 15
    fallos: [5, 10, 16, 20]
    regla: {tabla: configs/referencias/yin2012_tablas_transcripcion.csv, tabla_yin: 4,
            metodos: [PCA, DPCA], fdr_min: 20.0, fdr_max: 80.0, excluidos: [21]}
    si_falla: sin_apoyo    # un control se supera si el autoencoder y el baseline detectan
                           # por encima de su FAR (deteccion.suelo); si alguno falla, el
                           # veredicto no puede ser "apoya"; los controles no entran en
                           # Holm ni refutan (hypothesis_verdict, punto 6). Son 8 entradas,
                           # con las mismas simulaciones de prueba, el mismo n y la misma
                           # unidad (hipotesis.unidad_replica)
  tabla_ventajas_publicadas: configs/referencias/ventajas_publicadas.csv  # (2026-10-26)
                           # la tabla de ventajas publicadas, fijada antes de los
                           # experimentos confirmatorios (parrafos 349 y 368; filas del
                           # 2026-10-15 y del 2026-10-26). La condicion "menor que la
                           # publicada" se evalua frente a la fila papel_349 = comparadora
                           # con stats.published_advantage_test, sobre las medias de replica
                           # de hipotesis.unidad_replica, y se reporta como
                           # informacion (la diferencia con su intervalo): no entra en el
                           # veredicto. Ver configs/referencias/LEEME_ventajas_publicadas.md

deteccion:                 # (v0.3)
  ventana_far_normal: [160, null]  # (2026-10-15) muestras 161 a 960 de test_fault00,
                           # con el formato de far_window de metrics.evaluate_run:
                           # [inicio, fin] en base cero, fin excluido, null = el final.
                           # La misma ventana de la verificacion frente a Yin (DIS-2;
                           # informe 06). A0 y A1 (TEP clasico, desarrollo) siguen con
                           # la serie entera
  falsas_alarmas_por_hora: episodios  # (2026-11-04) la unidad del OE3 (parrafo 361):
                           # metrics.false_alarm_episodes_per_hour. Una racha de al menos
                           # protocolo.k_alarmas alarmas seguidas cuenta una vez, en
                           # test_fault00 y en la ventana de la FAR
                           # (deteccion.ventana_far_normal); se reporta con la FAR al lado. La
                           # otra opcion era "muestras" (false_alarm_samples_per_hour, la FAR
                           # por 20)
  mediana_retardo: censurada  # (2026-11-04) la que se reporta y la que usa
                           # compromiso.deteccion: delay_samples_median_censored de
                           # metrics.aggregate. Las simulaciones sin deteccion valida (sin racha
                           # o con racha al azar, protocolo.min_fdr) cuentan como mas tardias
                           # que cualquier retardo observado, y si la mitad o mas no detectan
                           # la mediana no se alcanza. La condicionada (delay_samples_median,
                           # solo sobre las detecciones validas) y valid_detection_ratio van al
                           # lado, como informacion. La otra opcion era "condicionada" (DIS-12)
  suelo:                   # (2026-10-18 y 2026-10-19) "Ninguno de los dos detecta el fallo
                           # por encima de su tasa de falsas alarmas" (parrafo 368):
                           # stats.detects_above_far. Una celda de la familia puede contar
                           # como apoyo si detecta al menos uno de los dos metodos
    margen: 0.01           # exceso minimo de la FDR sobre la FAR (pseudomediana de
                           # fdr - far por unidad; en Rieth, de las medias de replica,
                           # hipotesis.unidad_replica): la FAR nominal, 1 - protocolo.alpha.
                           # Con ese exceso, la mitad de las alarmas durante el fallo se
                           # deben al fallo. Fijado sin mirar el piloto
    margen_sensibilidad: [0.0, 0.005, 0.02]  # el veredicto se reporta tambien con estos
                           # margenes, en una tabla aparte y fuera del veredicto
    far_emparejada: gemela_normal  # la FAR de la misma simulacion de test_fault00 en
                           # deteccion.ventana_far_normal (la de la metrica de la ventaja).
                           # La otra opcion era "prefallo" (160 muestras, otra ventana)
    alpha: 0.05            # el de contrastes.alpha_contrastes
    correccion: ninguna    # el contraste es contra el margen y el suelo es una condicion
                           # de entrada, no un hallazgo; corregir solo haria mas dificil
                           # apoyar
    min_simulaciones: 5    # stats.MIN_PAIRS: el minimo con que un Wilcoxon unilateral
                           # puede dar p <= 0,05 (1/2^5); el mismo umbral que
                           # contrastes.no_contrastables. Cuenta unidades: en Rieth, las
                           # replicas
  pr_auc_conjunto: por_simulacion_con_gemela  # (2026-11-04) metrics.pr_auc por (fallo,
                           # simulacion): positivas, las muestras 161 a 960 del fichero con
                           # fallo; negativas, las mismas de su gemela de test_fault00
                           # (deteccion.ventana_far_normal). Prevalencia fija del 50 %, que se
                           # reporta al lado. En Rieth, si se contrasta, la media por replica
                           # (hipotesis.unidad_replica). Las otras opciones eran el fichero con
                           # fallo entero (prevalencia del 83 %) y un pool por fallo

diagnostico:               # (v0.3)
  incluir_normal: false    # (2026-10-26) la clase normal NO entra en el promedio de la
                           # macro-F1 (include_normal de metrics.diagnosis_metrics): la
                           # macro-F1 promedia los 20 fallos, y la F1 de la clase normal
                           # se reporta aparte (per_class). El mismo valor en los tres
                           # bloques
  etiqueta_prefallo: null  # PENDIENTE. Que se hace con las muestras previas al inicio
                           # del fallo en el diagnostico (regla 6). Cambia la macro-F1 de
                           # compromiso.diagnostico: se fija antes de la primera ejecucion
                           # confirmatoria de diagnostico (2026-11-03)

particion:
  fraccion_ajuste: 0.6
  fraccion_validacion: 0.2
  fraccion_prueba: 0.2
  calibracion_limites: 0.3  # parte de los datos normales reservada para calibrar. Solo
                            # tiene sentido en el TEP clasico (corte temporal de d00.dat
                            # en A0 y A1); en Rieth se reservan simulaciones (abajo)
  rieth:                    # (2026-10-18) simulaciones normales de train_fault00 por
                            # replica de ajuste (M15 de rev_trazabilidad); los ids, en
                            # configs/referencias/rieth_ids_prerregistro.csv
    normales_ajuste: 14     # para ajustar PCA y DPCA; el autoencoder entrena con 10
    normales_parada: 4      # de las de ajuste, para la parada temprana del autoencoder
                            # (el reparto del C00, celda 35)
    normales_calibracion: 20  # para calibrar los limites (otras que las del ajuste):
                            # desviacion de la FAR realizada claramente menor que 0,5
                            # puntos (fila 25)
    replicas_ajuste: 12     # regla: grupos de 34 normales que caben sin solaparse en
                            # data.unseen_runs("train", 0), con un minimo de 8 (con Holm
                            # sobre 4 contrastes hace falta R >= 8; informe 06, 2.3). Con
                            # RIETH_SEEN_PENDING cerrado (2026-10-21) quedan 408 libres
    reparto: subsample_disjunto_y_split_runs  # (2026-10-18) que normales van a cada
                            # replica: ablation.subsample_runs(data.unseen_runs("train",
                            # 0), 34, R, protocolo.semilla, disjoint=True); dentro de cada
                            # una, data.split_runs(34, (10/34, 4/34, 20/34),
                            # protocolo.semilla) sobre las posiciones de sus ids ordenados
                            # (entrenar, parar, calibrar)

datos:
  fuente: classic           # classic | rieth
  runs_desarrollo: 20
  runs_finales: 100         # primer peldano de datos.regla_n (2026-10-15)
  fault_onset_test: 160
  regla_n:                  # (2026-10-15) numero de simulaciones de prueba confirmatorias
                            # por fallo: regla prerregistrada, no un numero fijo (fila
                            # de esa fecha en docs/decisiones.md)
    piloto: experiments/P1_piloto_varianza.py  # con las simulaciones de prueba 1 a 20 y
                            # las normales 1 a 40 de train_fault00 (fila del 2026-10-18 que
                            # enmienda la 29), despues de la etiqueta y antes de cualquier
                            # ejecucion confirmatoria
    sigma_ref: max_sigma_upper_95  # maximo, en las seis celdas, de la cota superior
                            # unilateral al 95 % de sigma (columna sigma_upper de P1)
    peldanos:               # el primero cuyo umbral cumpla sigma_ref; el ultimo, sin umbral;
                            # sqrt(n) / sigma_ref >= 200 en cada peldano hasta 0,10
      - {n: 100, si_sigma_ref_menor_o_igual: 0.05}
      - {n: 200, si_sigma_ref_menor_o_igual: 0.07}
      - {n: 400}            # si sigma_ref > 0,10, el capitulo 4 declara la potencia
    tope: ids_libres        # n nunca supera los ids libres de datos.ids_confirmatorios
  ids_confirmatorios:       # (2026-10-15) procedimiento (regla 3; fila de esa fecha)
    no_mirado_segun: test   # cuentan los 21 ficheros de prueba: data.unseen_runs("test");
                            # los de entrenamiento con fallo solo ajustan el diagnostico
    seleccion: ids_mas_altos  # los n ids mas altos de esa lista (n de datos.regla_n),
                            # los mismos en los tres bloques y en todas las clases
    normales_de: unseen_train_fault00  # ajuste y calibracion: data.unseen_runs("train", 0)
                            # con el reparto de particion.rieth. RIETH_SEEN_PENDING
                            # (prefijos del C00) se cerro el 2026-10-21 con el prefijo
                            # K = 30; los ids, en configs/referencias/rieth_ids_prerregistro.csv
  tramo_copiado: inicio_nominal_medido  # (2026-10-26) tramo de Rieth que sigue siendo
                            # copia de la gemela tras el inicio nominal: no se descarta
                            # ninguna fila y todas las metricas se miden desde el inicio
                            # nominal, en los tres bloques y en las dos tareas; cada
                            # ejecucion confirmatoria guarda copied_after_onset de
                            # data.effective_onset por fallo y simulacion, y las tablas lo
                            # reportan (regla 6)

pca:
  variance: 0.85
  spe_method: box           # box | jackson | kde | empirical
  lags: 0                   # 0 = PCA, 1 o 2 = DPCA
  t2_method: f              # (v0.3) f | beta | empirical | kde. "f" (Fase II) es el de
                            # siempre y el valor por defecto de PCAMonitor
  quantile_method: linear   # (v0.3) linear | conformal: estimador del percentil de los
                            # limites empirical; "linear" es el de siempre
  calibration: holdout      # (v0.3) holdout | in_sample. Limites calibrados con datos
                            # normales reservados (regla 3; parrafo 367). in_sample solo
                            # para el brazo en muestra del factor 1 y para Yin

limites_protocolo:          # (2026-10-18) Los valores de pca de arriba son los de
                            # desarrollo (A0 y A1). Los del resultado en Rieth: "todos
                            # los umbrales se calibraran a la misma FAR nominal con
                            # simulaciones normales reservadas" (parrafo 367; informe
                            # 06, 2.2 y 3.3)
  t2_method: empirical      # cuantil empirico en las normales reservadas (con f, el
                            # limite sale de la F con el numero de filas del ajuste, sin
                            # ninguna normal reservada)
  spe_method: empirical     # idem (box usa las reservadas a traves de una aproximacion)
  quantile_method: linear   # el de desarrollo y el del umbral del autoencoder del C00
  nivel_por_estadistico: sidak  # en la regla T2 o SPE, cada limite a alpha ** 0.5
                            # (0,994987), para una FAR nominal conjunta del 1 % si son
                            # independientes (DIS-10; PCAMonitor.combined_index)
  orden_escalado_dpca: escalar_y_retardar  # escalar con las normales de ajuste y despues
                            # retardar (gancho scaler=); el orden de Yin et al. (2012,
                            # p. 1570) y de la configuracion principal de V1 (imp_monitor,
                            # decision 7)

ablaciones:                 # (v0.3) Prerregistro de las cuatro ablaciones sobre Rieth
                            # (parrafos 355 y 367; informe 06, 2.1 a 2.4). familia_holm y
                            # regla_equivalencia valen para los cuatro factores; el factor
                            # 1 se fijo del 2026-10-26 al 2026-10-29 (filas de esas fechas);
                            # la metrica, los brazos, la unidad y la familia de los factores
                            # 2 a 4 van en sus adendas
  unidad_replica:           # (2026-10-28) factor 1: diseno anidado. Cada replica de ajuste
                            # se evalua sobre su propio grupo de simulaciones de prueba,
                            # disjunto de los de las demas, y el contraste es
                            # stats.compare_arms(..., replicate_col=..., unit="replicate")
    diseno: anidado
    unidad: replicate
    grupos_prueba: subsample_runs_disjunto  # ablation.subsample_runs(ids de
                            # datos.ids_confirmatorios, n // R, R, protocolo.semilla,
                            # disjoint=True), con los ids en orden creciente, como los da
                            # data.unseen_runs, y no en el del CSV (2026-11-03); la replica
                            # r de particion.rieth.reparto va con el grupo r (la fila r de
                            # la salida), y los n mod R que sobran no entran en el factor 1.
                            # Los ids son de simulationRun, comunes a todas las clases: las
                            # gemelas van juntas
  familia_holm: por_factor  # (2026-10-29) una familia por factor. En el factor 1, los 4
                            # contrastes del brazo sucio principal (brazos_factor1) en la
                            # FAR, para PCA y DPCA con T2 y SPE (compare_arms con
                            # family=()); fuera de Holm, los brazos secundarios, la regla
                            # T2 o SPE y las metricas exploratorias
  regla_equivalencia: effect_test  # (2026-10-29) la de stats.effect_test, con el delta de
                            # la metrica principal como margen (factor 1:
                            # contrastes.delta.far): dos Wilcoxon unilaterales por
                            # desenlace (sin empates, relevante si el intervalo al 95 % queda
                            # fuera de +-delta y equivalente si el del 90 % queda dentro; si
                            # no, inconcluso); Holm por separado a cada desenlace
  metrica_principal:
    factor1: far            # (2026-10-29) FAR realizada en test_fault00, en
                            # deteccion.ventana_far_normal: brazo en muestra menos brazo
                            # reservado. FDR cruda, exceso y retardo, exploratorias
    factor2: null
    factor3: null
    factor4: null
  estimanda_factor3: null   # detectores: FAR externa u optimismo de la FAR interna
  brazo_sucio_factor2: null # S1 (ajuste y prueba juntos), S2 (cada simulacion con sus
                            # propios estadisticos) o los dos (parrafo 284)
  brazos_factor1:           # (2026-10-29) PCA y DPCA (OE1); los del autoencoder, con las
                            # claves del OE3
    limpio: limites_protocolo  # cuantil empirico sobre las normales de calibracion
    sucio_principal: en_muestra_mismo_estimador  # el mismo estimador sobre el estadistico
                            # de las normales del ajuste (PCAMonitor.fit(...,
                            # calibration="in_sample")); el unico en la regla y en Holm
    secundarios: [t2_f, t2_beta, spe_jackson, reservada_14]  # exploratorios: la
                            # configuracion de Yin et al. (2012) y el cuantil reservado con
                            # las 14 de menor id de las 20 normales de calibracion de cada
                            # replica (2026-11-03)
    estadisticos: [t2, spe] # los del brazo principal y de Holm; la regla T2 o SPE
                            # (sidak), exploratoria

compromiso:                 # (2026-11-03, precisado el 2026-11-04) criterio de mejor
                            # compromiso, uno por tarea (parrafos 342, 349 y 369), sobre una
                            # lista cerrada de candidatos con su familia: restriccion y luego
                            # orden, paso a paso. En deteccion, la unidad es la replica
                            # (hipotesis.unidad_replica): cada metrica se calcula por replica
                            # con sus simulaciones validas, y una replica sin ninguna sale; en
                            # diagnostico, la unidad del diseno confirmatorio del OE2. La
                            # restriccion, sobre la media de las unidades redondeada a 6
                            # decimales. En cada paso del orden sale quien queda a una distancia
                            # relevante de cualquier otro de los que siguen; si salieran todos,
                            # siguen todos. "empate: <clave de un delta>": en cada par,
                            # stats.non_superiority_test sobre sus diferencias por unidad, en el
                            # sentido de su pseudomediana (si es 0, p = 1), frente a ese delta
                            # (p_above_delta), con Holm al contrastes.alpha_contrastes sobre los
                            # pares del paso (stats.holm_correction). Un par con menos de 5
                            # unidades validas en comun no es contrastable: cuenta en Holm con
                            # p = 1 (contrastes.no_contrastables) y no elimina.
                            # "empate: <numero>": margen fijo; sale quien queda a mas de el del
                            # mejor. La familia es la declarada, como en
                            # contrastes.no_contrastables: un candidato de la lista con menos de
                            # 5 unidades validas (una unidad es valida si tiene todas las
                            # metricas del criterio) o sin coste medido, porque no se ejecuto o
                            # porque fallo, sigue en todos los pasos con p = 1 en sus pares, no
                            # entra en la restriccion ni en los pasos con un numero, no elimina
                            # a nadie, no puede quedar elegido y se reporta como desviacion.
                            # Queda un metodo, varios de una familia (un resultado de esa
                            # familia) o varios de familias distintas (compromiso compartido);
                            # si nadie cumple la restriccion, esa tarea no tiene compromiso y se
                            # reporta asi. La primera ejecucion confirmatoria de una tarea es la
                            # primera que lee las simulaciones de prueba de
                            # datos.ids_confirmatorios con cualquier metodo de esa tarea, este o
                            # no en la lista, para lo que sea: en deteccion, un detector de las
                            # familias 1 o 3 (para la hipotesis, las ablaciones o el
                            # compromiso); en diagnostico, un clasificador de las
                            # familias 2 o 3. stats.best_compromise compara solo con el mejor:
                            # esta regla la aplica de momento tests/test_decisiones_26_29oct.py.
                            # Los fallos 3, 9 y 15, aparte y descriptivos; el frente de Pareto
                            # (stats.pareto_front, sin la FAR y con los delta como tolerancia),
                            # solo como figura
  deteccion:                # familias 1 y 3
    candidatos:             # lista cerrada, una configuracion por metodo: la de la hipotesis
                            # para PCA, DPCA y el autoencoder; el KPCA, que no esta en ella, con
                            # la suya. Los cuatro se ajustan y calibran en cada replica de
                            # particion.rieth.reparto y evaluan su grupo de prueba. La lista
                            # solo cambia con una adenda con fecha y etiqueta antes de la
                            # primera ejecucion confirmatoria de deteccion; lo que se ejecute
                            # fuera de ella se reporta fuera del criterio. El T2 y la regla T2 o
                            # SPE de PCA y DPCA, solo en la figura
      - {nombre: pca, familia: 1}   # hipotesis.baselines (el SPE)
      - {nombre: dpca, familia: 1}  # hipotesis.baselines (el SPE, con 2 retardos)
      - {nombre: kpca, familia: 1}  # sin codigo todavia. Su configuracion (nucleo RBF, sigma,
                            # componentes, submuestreo y estadistico, el T2 o el SPE del espacio
                            # de caracteristicas), o un procedimiento que la elija solo con
                            # normales de entrenamiento y validacion sin margen de eleccion
                            # (regla 12), va en una adenda con fecha y etiqueta antes de la
                            # primera ejecucion confirmatoria de deteccion
      - {nombre: ae, familia: 3}    # el autoencoder del OE3, el de la hipotesis
    eliminacion: frente_a_cualquiera_con_holm  # la regla de arriba (2026-11-03)
    restricciones:
      - {metrica: far, operador: "<=", valor: 0.015}  # FAR realizada en test_fault00
                            # (deteccion.ventana_far_normal): la nominal (1 - protocolo.alpha)
                            # mas contrastes.delta.far
    orden:
      - {metrica: exceso_far_gemela, direccion: max, empate: contrastes.delta.fdr}
                            # por replica, la media en los 17 fallos sin 3, 9 y 15 de la media
                            # de sus simulaciones validas
      - {metrica: retardo, direccion: min, empate: contrastes.delta.retardo_muestras}
                            # por replica, la mediana en los 17 fallos de su mediana del retardo
                            # en cada fallo (deteccion.mediana_retardo), en muestras de 3
                            # minutos (protocolo.sample_minutes); si no se alcanza o no existe,
                            # 800 muestras (el final de la ventana)
      - {metrica: log10_inferencia_s, direccion: min, empate: 1.0}  # log10 del tiempo de
                            # inferencia por muestra en linea: infer_time_per_sample_s_median de
                            # cost.measure_cost con batch_size = 1, una vez por metodo, en la
                            # maquina de referencia (coste.*). Empatan si el mayor no pasa de 10
                            # veces el menor (10 veces justas, empate)
  diagnostico:              # familias 2 y 3
    candidatos: null        # PENDIENTE (2026-11-03): lista cerrada como la de deteccion, con la
                            # familia de cada uno: los clasificadores del OE2 bajo el protocolo
                            # (familia 2) y la red recurrente del OE3 (familia 3), una
                            # configuracion por metodo. La declaran Jonathan y Cesar en una
                            # adenda con fecha y etiqueta antes de la primera ejecucion
                            # confirmatoria de diagnostico
    eliminacion: frente_a_cualquiera_con_holm  # como en deteccion
    restricciones: []
    orden:
      - {metrica: macro_f1_rest, direccion: max, empate: contrastes.delta.macro_f1}
                            # macro-F1 sin la normal en los 17 fallos sin 3, 9 y 15
      - {metrica: log10_inferencia_s, direccion: min, empate: 1.0}  # como en deteccion

coste:                      # (v0.3) PENDIENTE (parrafo 369; tfmfdd.cost.measure_cost). El
                            # tiempo de inferencia por muestra en linea lo usa compromiso.*
                            # (2026-11-03), con batch_size = 1: el procedimiento (con que
                            # replica y que datos se mide; el coste del KPCA depende de su
                            # submuestreo) se fija antes de medirlo
  maquina_referencia: null
  hilos_blas: null
  hilos_torch: null
  ajuste_incluye: null      # calibracion de limites, parada temprana, busqueda...
  batch_size: null          # inferencia en linea (1) o por lotes, para la tabla de coste;
                            # compromiso.* usa 1
  n_repeats_fit: null
  n_warmup_fit: null
  n_repeats_infer: null
  n_warmup_infer: null
  memoria_reportada: null   # pico del ajuste, de la inferencia o de vida del proceso

robustez:                   # (v0.3) PENDIENTE. Adaptacion del indice de Bernal-de
                            # Lazaro et al. (2018), "con la rejilla de niveles de ruido,
                            # se declarara antes de ejecutar" (parrafo 369)
  niveles_deteccion: null   # rejilla de niveles (D_p depende del paso)
  niveles_diagnostico: null
  tipo_ruido: null          # gaussian | uniform
  variables: null
  sigma_s_de: null          # de que datos sale sigma_s, con que ddof y en que unidades
  n_repeticiones: null
  numeros_comunes: null
  metrica_deteccion: null   # far | missed_detection | eq3
  metrica_diagnostico: null # eq3 | one_minus_macro_f1
  limite: null              # fijo o recalibrado en cada nivel
  confianza: null

fallos_dificiles: [3, 9, 15]  # se reportan siempre por separado
