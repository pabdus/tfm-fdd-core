[build-system]
# setuptools >= 77: project.license como expresion SPDX y project.license-files
# (PEP 639). La tabla license = {text = "MIT"} que habia antes esta en desuso, y
# setuptools dejara de construirla a partir del 18/02/2027.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tfmfdd"
version = "0.3.0"
description = "Infraestructura comun para la comparativa de metodos de deteccion y diagnostico de fallos sobre el Tennessee Eastman Process (TFM UNIR)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
# Solo LICENSE. Sin esta lista, setuptools mete en la rueda cualquier fichero
# LICEN[CS]E* de la raiz, por ejemplo un LICENSE.zip de un paquete de cambios.
license-files = ["LICENSE"]
authors = [{name = "Pablo Alberto Duque Marin"}]
# Minimos que exige el codigo (CAMBIOS.md, v0.3, "Empaquetado"). Las versiones
# exactas con que pasaron las pruebas estan en requirements-probado.txt.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.6",
    "matplotlib>=3.7",
    "pyarrow>=12.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
# Solo para convertir los .RData de Rieth (tfmfdd.convert_rieth). Los Parquet ya
# convertidos se reparten con su manifiesto, asi que casi nadie lo necesita.
rieth = ["pyreadr>=0.5"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["tfmfdd*"]

[tool.setuptools.package-data]
# La copia de configs/baseline.yaml que viaja con el paquete (tfmfdd.config la
# usa cuando no encuentra otra).
tfmfdd = ["configs/*.yaml"]
