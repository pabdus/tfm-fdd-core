# Verificacion de la implementacion frente a Yin et al. (2012), J. Process Control
# 22, 1567-1581 (doi:10.1016/j.jprocont.2012.06.009). La lee
# experiments/V1_verificacion_yin.py. Paginas: la paginacion impresa (1567-1581).
#
# Que se verifica (memoria, parrafos 355 y 369): la IMPLEMENTACION del codigo
# ejecutada con la configuracion de esos autores, que calibra los limites en
# muestra; no las reglas del protocolo, que calibra con datos reservados. Se
# compara la FDR por fallo y la FAR en operacion normal de PCA y DPCA con las
# Tablas 4 y 5 (p. 1574), "sin ajustes para que coincidan y sin contar los
# fallos 3, 9 y 15". No es el protocolo comun: por eso no esta en baseline.yaml.
#
# La especificacion de la verificacion esta en docs/verificacion_yin.md (sale de
# la del agente ref_yin, 12/10/2026, que leyo el PDF): las referencias de este
# fichero a "docs/verificacion_yin.md, S..." remiten a ella. Lo que el articulo
# dice esta en "explicito"; lo que no dice, en "supuestos" (S1 a S12, con la
# evidencia y la pagina, sin cifras nuestras: las calcula V1 --solo-limites y las
# recoge docs/verificacion_yin.md). Las claves en null son decisiones PENDIENTES
# de Pablo.
#
# Regla de orden. La tolerancia tiene que estar "fijada antes de ejecutar"
# (parrafo 355), asi que V1 NO abre ningun fichero de prueba (dXX_te.dat)
# mientras no se cumpla todo esto:
#   1. Ninguna clave de este fichero esta en null (salvo las de "secundaria" si
#      secundaria.incluir es false).
#   2. "python experiments/V1_verificacion_yin.py --huella" imprime la huella de
#      ESTE fichero (sus valores, no sus comentarios) y de los dos CSV de
#      configs/referencias/. Esa huella esta en una fila fechada de
#      docs/decisiones.md, con la etiqueta exacta [V1-yin huella=<12 hex>]; por
#      ejemplo:
#      | 2026-10-16 | Verificacion frente a Yin: tolerancia ..., ventana de la FAR ..., supuestos y variantes de configs/yin2012.yaml [V1-yin huella=0123456789ab] | Pablo | Parrafo 355 |
#      La fecha (primera celda) tiene que existir y no puede ser posterior al dia
#      de la ejecucion, y la fila tiene que verse: no vale dentro de un comentario
#      <!-- --> ni de un bloque de codigo.
#   3. Este fichero, docs/decisiones.md, configs/referencias/ y el codigo que se
#      ejecuta (experiments/V1_verificacion_yin.py y la carpeta tfmfdd/ que se
#      importa) estan confirmados en git, en el mismo repositorio: versionados, sin
#      cambios, sin marcas skip-worktree ni assume-unchanged. Asi tampoco se puede
#      cambiar el codigo despues de ver un resultado (parrafo 369: "sin ajustes
#      para que coincidan"). Los pasos estan en docs/decisiones.md.
# Cambiar cualquier valor de este fichero o de las referencias cambia la huella,
# y V1 vuelve a negarse hasta que haya una fila nueva. "--solo-limites" solo usa
# d00.dat (el ajuste) y no necesita nada de esto.

referencia:
  tablas: referencias/yin2012_tablas_transcripcion.csv  # relativa a esta carpeta
  umbrales: referencias/yin2012_umbrales_dibujados.csv
  transcripcion_verificada: "2026-10-14"  # Fecha (AAAA-MM-DD) en que Pablo comprobo
                           # contra el PDF las Tablas 4, 5, 7 y 8 (las nueve columnas)
                           # y los umbrales dibujados de las Fig. 2 y 5
                           # (configs/referencias/LEEME_...md)
  tabla_fdr: 4             # Tabla 4, "FDRs (%) based on TE data sets given in [6]", p. 1574
  tabla_far: 5             # Tabla 5, "FARs (%) ...", p. 1574

explicito:                 # lo que dice el articulo
  variables: yin33         # XMEAS(1-22) y XMV(1-11), "included for FDA, PCA and ICA
                           # related methods" (p. 1573): data.YIN_VARS
  n_components:            # Tabla 3 (p. 1572) y texto (p. 1573), elegidas por PRESS.
    PCA: 9                 # Se fija l; no se reproduce el PRESS, porque el articulo
    DPCA: 17               # no dice que variante uso
  t2_method: f             # ec. (3), p. 1568: l(N^2-1)/[N(N-l)] F_alfa(l, N-l), el
                           # limite de Fase II (Tracy et al.), con el N del ajuste
  calibration: in_sample   # las ec. (2) y (3) usan cantidades del ajuste (N y sus
                           # autovalores): los dos limites son parametricos en muestra
  regla_alarma: t2_o_spe   # "SPE <= Jth,SPE and T2 <= Jth,T2 => fault free, otherwise
                           # faulty" (p. 1568, paso 3); "if one of the test statistics
                           # exceeds threshold" (p. 1572-1573). Desigualdad estricta.
                           # PCAMonitor.combined_index con limite 1
  excluidos_veredicto: [3, 9, 15]  # memoria, parrafo 369 (coincide con la columna
                           # fallo_excluido_parrafo369 de la transcripcion)
  retardo_k: 3             # solo informacion: Yin no reportan retardo (no hay cifra
                           # con que compararlo); k = 3 del protocolo (parrafo 276)

supuestos:                 # lo que el articulo no dice (docs/verificacion_yin.md, 3)
  S1_n_ajuste: 500         # d00.dat entero. La p. 1568 solo dice "Collect N samples" y
                           # la p. 1572 habla de 24 h de entrenamiento (480 muestras).
                           # Evidencia: con 500 filas el SPE de Jackson cae dentro de la
                           # lectura del umbral dibujado (Fig. 2, p. 1573; Fig. 5,
                           # p. 1576) y con 480 no (V1 --solo-limites). Alternativa: 480
  S2_fichero_far: d00_te.dat  # la Tabla 5 da la FAR en la fila "Fault Free, IDV(0)"
                           # (p. 1574); el fichero no se nombra
  S3_variables_dpca: yin33 # las mismas 33 variables en el DPCA ("PCA ... related
                           # methods", p. 1573)
  S4_ddof: 1               # desviacion con N - 1, como la covarianza de la ec. (1),
                           # p. 1568. Con ddof = 0 el SPE se aleja del dibujado
                           # (--solo-limites). Alternativa: 0
  S5_orden_dpca: escalar_y_retardar  # z_i(h) = [z_i ... z_(i-h)] con los z ya
                           # normalizados (p. 1570): escalar y luego retardar (en V1, el
                           # gancho scaler= de PCAMonitor). Alternativa:
                           # retardar_y_escalar (PCAMonitor sin gancho). El efecto en el
                           # SPE del DPCA es del orden de la precision de la lectura
  S6_lags_dpca: 2          # h no se declara para la Tabla 4. Solo h = 2 da un SPE de
                           # Jackson cercano al dibujado; h = 1 y h = 3 quedan lejos
                           # (docs/verificacion_yin.md, S6). Sin alternativa: si no se
                           # acepta, el
                           # DPCA de la Tabla 4 no se puede verificar
  S7_nivel: 0.99           # la p. 1568 solo dice "a given significant level alpha". El
                           # T2 dibujado del PCA es la ec. (3) con l = 9, N = 500 y 0,99
                           # (--solo-limites), no con 0,95 (docs/verificacion_yin.md, S7)
  S8_spe_method: jackson   # ec. (2) de Jackson y Mudholkar con theta_i = suma de
                           # lambda_j ** i. El PDF imprime el exponente 2 para i = 1, 2,
                           # 3 (errata, p. 1568); con la formula impresa o con Box en
                           # muestra el SPE no reproduce el umbral dibujado y con la
                           # corregida si (docs/verificacion_yin.md, S8; --solo-limites
                           # calcula la corregida)
  S9_far_ventana: [160, null]  # Decidido por Pablo el 14/10/2026. Ventana de la FAR en
                           # d00_te.dat, como far_window de metrics.evaluate_run: [inicio,
                           # fin] en base cero, fin excluido, null = el final. Se eligio
                           # [160, null] (muestras 161 a 960) porque las 18 FAR de las Tablas 5
                           # y 8 estan en la rejilla k/800 y solo 2 en la k/960
                           # (docs/verificacion_yin.md, S9). Variantes informativas: [0, null] y
                           # [0, 800]
  S10_fdr_desde: 160       # FDR sobre las muestras 161 a 960 de cada dXX_te.dat (fallo a
                           # las 8 h = 160 muestras de 3 min, p. 1572; las 84 FDR de PCA y
                           # DPCA de las Tablas 4 y 7 estan en la rejilla k/800)
  S11_t2_limite_dpca: f_n_ajuste  # ABIERTO. La ec. (3) con l = 17 y el N del ajuste
                           # (lo que dice el articulo, p. 1570: "identical with standard
                           # PCA") no reproduce el T2 dibujado del DPCA (Fig. 2 y 5);
                           # ninguna alternativa natural lo hace (docs/verificacion_yin.md,
                           # S11).
                           # Opciones: f_n_ajuste, f_n_por_h1 (ec. 3 con N = (h + 1) por
                           # las filas del ajuste, conjetura numerica), dibujado_fig2,
                           # dibujado_fig5 (el umbral leido del CSV de umbrales)
  S12_dpca_primeras_muestras: no_evaluadas  # las h primeras muestras de cada
                           # fichero de prueba del DPCA no tienen historia: NaN ("no
                           # evaluada"), como hace PCAMonitor.score. No afecta a la FDR
                           # (161 a 960) ni a la FAR en [160, null]

variantes:                 # declaradas de antemano (docs/verificacion_yin.md, 3 y 6): salen en
                           # filas aparte y NO cambian el veredicto. Una variante que no
                           # cambia nada en un metodo (por ejemplo S5 en el PCA) se omite
  - nombre: S1_n480
    cambios: {S1_n_ajuste: 480}
  - nombre: S4_ddof0
    cambios: {S4_ddof: 0}
  - nombre: S5_retardar_y_escalar
    cambios: {S5_orden_dpca: retardar_y_escalar}
  - nombre: S9_far_1_960
    cambios: {S9_far_ventana: [0, null]}
  - nombre: S9_far_1_800
    cambios: {S9_far_ventana: [0, 800]}
  - nombre: S11_t2_n_por_h1
    cambios: {S11_t2_limite_dpca: f_n_por_h1}
  - nombre: S11_t2_dibujado_fig2
    cambios: {S11_t2_limite_dpca: dibujado_fig2}
  - nombre: S11_t2_dibujado_fig5
    cambios: {S11_t2_limite_dpca: dibujado_fig5}

tolerancia:                # Fijada por Pablo el 14/10/2026, antes de ejecutar (parrafo 355): opcion A.
                           # En puntos porcentuales, sobre los 18 fallos de los bloques 1
                           # y 2 (sin 3, 9 y 15). Las opciones del informe 15 (5.2) y de
                           # docs/verificacion_yin.md (7), traducidas a estas claves:
                           #   A (replica estricta): umbral_por_fallo 0,5 en los 18
                           #     (min_fallos_dentro 18), far_max 0,5, el resto no_aplica.
                           #   B (ligada a delta): umbral_por_fallo 2 en al menos 16,
                           #     fdr_max 5, far_max 2, media no_aplica.
                           #   C (global): fdr_media_max 1, fdr_max 5, far_max 2,
                           #     umbral_por_fallo y min_fallos_dentro no_aplica.
                           # Un criterio que no se use se escribe "no_aplica" (null
                           # significa "sin decidir"). La FAR es obligatoria: la memoria
                           # pide reproducir la FDR por fallo y la FAR (parrafo 369).
  comparacion: conteo      # "conteo": |alarmas nuestras - recuento de Yin| x 100 / n,
                           # exacto (sus cifras son k/800 redondeadas a dos decimales);
                           # "impreso": |nuestra tasa - valor impreso|. Solo difieren en
                           # el borde del umbral (hasta 0,005 puntos)
  fdr_umbral_por_fallo_pp: 0.5    # 4 muestras de 800
  fdr_min_fallos_dentro: 18       # los 18 fallos de los bloques 1 y 2
  fdr_max_pp: no_aplica
  fdr_media_max_pp: no_aplica
  far_max_pp: 0.5                 # 4 muestras de 800
  dpca: descriptivo        # "criterio" (la misma regla que el PCA) o "descriptivo"
                           # (diferencia por fallo, sin aprobado ni suspenso; informe 15,
                           # 5.2). En esta verificacion el DPCA no pasa a tener veredicto
                           # (docs/decisiones.md, fila del 2026-10-14)

secundaria:                # Tablas 7 (p. 1576) y 8 (p. 1577): los mismos datos con otra
                           # configuracion (Tabla 6, p. 1575). Comprobacion secundaria:
                           # sale en filas aparte y sin veredicto
  incluir: true            # Decidido por Pablo el 14/10/2026: comprobacion informativa
  tabla_fdr: 7
  tabla_far: 8
  n_components:
    PCA: 17                # Tabla 6 (p. 1575): porcentaje de varianza, en torno al 90 %
    DPCA: 40               # Decidido por Pablo el 14/10/2026. La Tabla 6 dice 40 y el texto
                           # 42 (p. 1575); docs/verificacion_yin.md (2.3) propone 40 y su
                           # apartado 10 dice como comprobar con d00.dat cuantas
                           # componentes da el 90 % de la varianza
